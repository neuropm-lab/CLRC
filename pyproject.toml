[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clrc"
version = "0.1.0"
description = "Cell-type-resolved directed Ligand-Receptor Connectome (CLRC): construction, prediction, and analysis pipeline"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.1",
    "scipy>=1.12",
    "h5py>=3.10",
    "xgboost>=3.0",
    "optuna>=3.5",
    "shap>=0.51",
    "scikit-learn>=1.4",
    "gseapy>=1.1",
    "networkx>=3.1",
    "tqdm>=4.66",
    "numba>=0.59",
    "pyyaml>=6.0",
    "anndata>=0.10",
    "joblib>=1.3",
    "openpyxl>=3.1.5",
    "brainsmash>=0.11.0",
    "pyarrow>=23.0.1",
    "nibabel>=5.0",
]

[project.optional-dependencies]
gpu = ["torch>=2.1", "cupy-cuda13x>=13"]  # CUDA 13 — change to cupy-cuda12x for CUDA 12 systems

[tool.hatch.build.targets.wheel]
packages = ["src/clrc", "src/neuronchat"]

[tool.hatch.build.targets.wheel.force-include]
"src/neuronchat/data" = "neuronchat/data"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
