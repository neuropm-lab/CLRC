analysis_name: "rosmap_expanded_1092lr"

data:
  h5_dir: "data/expanded_nc_obj/neuronchat_by_subject_h5"
  h5_pattern: "nc_subj_*_M50.h5"
  clinical_csv: "data/metadata/ROSMAP_clinical.csv"
  clinical_xlsx: "data/metadata/dataset_810_cross-sectional_05-27-2024.xlsx"

clinical:
  variables:
    - "cogng_demog_slope"   # global cognition slope
    - "cogn_global_lv"      # global cognition
    - "gpath"               # global pathology
    - "amylsqrt"            # amyloid accumulation (sqrt-transformed)
    - "tangsqrt"            # tau accumulation (sqrt-transformed, subject-level whole-brain)
  covariates:
    - "age_death"
    - "educ"
    - "msex"

ad_analysis:
  min_subjects: 10  # minimum valid subjects for partial Spearman
  top_k_features: 20  # for colorbar/clustermap plots

region_aliases:
  A24: "ACC"

expression_matrix:
  # Consumed by pipeline/shared/build_expression_matrix.py.
  source: "rosmap"
  rosmap:
    source_h5ad: "data/AD_Multiomic_MultiRegion/snRNA_Matrix.h5ad"
    # Cell Type Mapper needs ENSG var_names; symbols are restored afterwards.
    ensg_column: "gene_ids"
    symbol_column: "varnames"
    mapper_input_h5ad: "data/AD_Multiomic_MultiRegion/snRNA_Matrix_ensg.h5ad"
    write_mapper_input: true
    # Cell Type Mapper config naming the precomputed stats and query markers
    # for the ABC 10x whole-human-brain taxonomy (CCN202210140).
    mapper_config: "configs/cell_type_mapper.yaml"
    mapper_result_csv: "data/mapmycells_result/output.csv"
    region_column: "BrainRegion"
    supercluster_column: "supercluster_name"
    output_h5ad: "data/AD_Multiomic_MultiRegion/snRNA_Matrix_afterMapMyCells.h5ad"

neuronchat:
  # Consumed by pipeline/shared/build_connectome.py; one H5 per subject.
  scope: "subject"
  expression_h5ad: "data/AD_Multiomic_MultiRegion/snRNA_Matrix_afterMapMyCells.h5ad"
  db_json: "src/neuronchat/data/merged_interactionDB_human_1092LR.json"
  group_by: "region_supercluster_celltype"
  subject_col: "ROSMAP_IndividualID"
  M: 50            # must match the M in data.h5_pattern above
  fdr: 0.05
  seed: 42
  device: "cpu"
  n_jobs: 8        # CPU backend only
  layer: null
  normalize: "auto"  # ROSMAP arrives as raw counts, so auto log-normalizes
  output_dir: "data/expanded_nc_obj/neuronchat_by_subject_h5"
  # Output name template; also drives the resume scan, so changing it starts a
  # fresh set of outputs rather than continuing an existing one.
  filename: "nc_subj_{subject}_M{M}.h5"
  # A subject below either threshold is skipped: the permutation test cannot
  # form a meaningful null.
  min_cells: 10
  min_groups: 2

output:
  base_dir: "out/rosmap_expanded"
